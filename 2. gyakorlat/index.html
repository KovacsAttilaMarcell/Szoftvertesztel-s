<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Arab - római szám konverter</title>

    <link rel="stylesheet" href="https://unpkg.com/qunit@3.0.0-alpha.4/qunit/qunit.css">
</head>

<body>

<div id="qunit"></div>
<div id="qunit-fixture"></div>

<script src="https://unpkg.com/qunit@3.0.0-alpha.4/qunit/qunit.js"></script>

<script>
    function arabToRoman(number) {

        if (number <= 0 || number > 3999) {
            return "";
        }

        const romanNumbers = [
            { value: 1000, symbol: "M" },
            { value: 900, symbol: "CM" },
            { value: 500, symbol: "D" },
            { value: 400, symbol: "CD" },
            { value: 100, symbol: "C" },
            { value: 90, symbol: "XC" },
            { value: 50, symbol: "L" },
            { value: 40, symbol: "XL" },
            { value: 10, symbol: "X" },
            { value: 9, symbol: "IX" },
            { value: 5, symbol: "V" },
            { value: 4, symbol: "IV" },
            { value: 1, symbol: "I" }
        ];

        let result = "";

        for (let i = 0; i < romanNumbers.length; i++) {
            while (number >= romanNumbers[i].value) {
                result += romanNumbers[i].symbol;
                number -= romanNumbers[i].value;
            }
        }

        return result;
    }

    QUnit.module("Arab - római szám konverter tesztelése");

    QUnit.test("1 átalakítása", function(assert) {
        assert.equal(arabToRoman(1), "I");
    });

    QUnit.test("Egyszerű számok átalakítása", function(assert) {
        assert.equal(arabToRoman(2), "II");
        assert.equal(arabToRoman(3), "III");
        assert.equal(arabToRoman(5), "V");
        assert.equal(arabToRoman(10), "X");
    });

    QUnit.test("Kivonásos római számok", function(assert) {
        assert.equal(arabToRoman(4), "IV");
        assert.equal(arabToRoman(9), "IX");
        assert.equal(arabToRoman(40), "XL");
        assert.equal(arabToRoman(90), "XC");
        assert.equal(arabToRoman(400), "CD");
        assert.equal(arabToRoman(900), "CM");
    });

    QUnit.test("Összetett számok átalakítása", function(assert) {
        assert.equal(arabToRoman(14), "XIV");
        assert.equal(arabToRoman(49), "XLIX");
        assert.equal(arabToRoman(58), "LVIII");
        assert.equal(arabToRoman(1994), "MCMXCIV");
    });

    QUnit.test("Legnagyobb megengedett szám", function(assert) {
        assert.equal(arabToRoman(3999), "MMMCMXCIX");
    });

    QUnit.test("Érvénytelen számok", function(assert) {
        assert.equal(arabToRoman(0), "");
        assert.equal(arabToRoman(-5), "");
        assert.equal(arabToRoman(4000), "");
    });

</script>

</body>
</html>
